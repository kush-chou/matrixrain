plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.matrixrain.wear'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.matrixrain.watchface"
        minSdk 30 // Wear OS 3+ (Pixel Watch 1/2/3/4/5, Galaxy Watch 4/5/6/7)
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH") ?: project.findProperty("KEYSTORE_PATH") ?: "../release.keystore"
            def keystoreFile = file(keystorePath)
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: project.findProperty("KEYSTORE_PASSWORD") ?: "matrixrain"
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: project.findProperty("KEY_ALIAS") ?: "matrixrain"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: project.findProperty("KEY_PASSWORD") ?: "matrixrain"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.wear:wear:1.3.0'
}
