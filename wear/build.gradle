plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.matrixrain.wear'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.matrixrain.watchface"
        minSdk 30 // Wear OS 3+ (Pixel Watch 1/2/3/4/5, Galaxy Watch 4/5/6/7)
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.wear:wear:1.3.0'
}
